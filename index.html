<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
/>

<title>¡Feliz cumpleaños, Jenny! 🎂</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    touch-action: none;
}

#universo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
}

/* ============================================= */
/* TITULO */
/* ============================================= */

.titulo {
    position: fixed;

    top: 25px;
    left: 50%;

    width: 94%;

    transform:
        translateX(-50%)
        translateY(-25px);

    text-align: center;

    z-index: 15;

    opacity: 0;
    filter: blur(10px);

    pointer-events: none;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        filter 1.5s ease;
}

.titulo.visible {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

    filter: blur(0);
}

.titulo h1 {

    font-size:
        clamp(
            1.7rem,
            4.2vw,
            3.8rem
        );

    font-weight: 700;

    color: #c99400;

    letter-spacing: .5px;

    text-shadow:
        0 0 7px rgba(201, 148, 0, .45),
        0 0 16px rgba(201, 148, 0, .25),
        0 0 30px rgba(201, 148, 0, .10);
}

/* ============================================= */
/* TEXTO INFERIOR */
/* ============================================= */

.pie {

    position: fixed;

    bottom: 22px;

    left: 50%;

    width: 94%;

    transform:
        translateX(-50%)
        translateY(30px);

    text-align: center;

    z-index: 15;

    opacity: 0;

    pointer-events: none;

    filter: blur(7px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        filter 1.5s ease;
}

.pie.visible {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

    filter: blur(0);
}

.pie p {

    color: #b88908;

    font-size:
        clamp(
            .85rem,
            1.7vw,
            1.20rem
        );

    font-weight: 700;

    letter-spacing: 3px;

    text-shadow:
        0 0 7px rgba(184, 137, 8, .35),
        0 0 15px rgba(184, 137, 8, .15);
}

/* ============================================= */
/* INTRO */
/* ============================================= */

.inicio {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:

        radial-gradient(
            circle at center,
            rgba(40, 30, 0, .15) 0%,
            rgba(0, 0, 0, .88) 45%,
            #000 100%
        );

    z-index: 30;

    cursor: pointer;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.inicio.oculto {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}

.inicio-contenido {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 28px;
}

/* ============================================= */
/* PASTEL DEL INICIO */
/* ============================================= */

.pastel-inicial {
    position: relative;
    width: clamp(150px, 22vw, 220px);
    height: clamp(150px, 22vw, 220px);
    animation: latidoPastel 2.6s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(255,201,26,.25));
}
.pastel-inicial svg { width: 100%; height: 100%; overflow: visible; }
.aro-carga {
    position: absolute; inset: -18px; border-radius: 50%;
    border: 2px solid rgba(255,210,90,.12);
    border-top-color: #ffe984; border-right-color: #c99400;
    animation: girarAro 3s linear infinite;
    box-shadow: 0 0 18px rgba(255,201,26,.08);
}
.llama { transform-box: fill-box; transform-origin: center bottom;
    animation: llamaViva .65s ease-in-out infinite alternate; }
.llama-dos { animation-delay: -.3s; }
.llama-tres { animation-delay: -.5s; }
@keyframes girarAro { to { transform: rotate(360deg); } }
@keyframes llamaViva {
    from { transform: rotate(-5deg) scale(.91,1.04); opacity: .8; }
    to { transform: rotate(5deg) scale(1.09,.93); opacity: 1; }
}
.inicio:focus-visible { outline: 2px solid #ffe984; outline-offset: -8px; }
.tarjeta { max-height: 90dvh; overflow-y: auto; touch-action: pan-y; }
.toque {

    color: #c99400;

    font-size:
        clamp(
            1rem,
            2vw,
            1.35rem
        );

    font-weight: 600;

    letter-spacing: 1px;

    animation:
        toqueAnimado
        1.5s
        ease-in-out
        infinite;

    text-shadow:
        0 0 7px
        rgba(201, 148, 0, .3);
}

/* ============================================= */
/* MINIJUEGO */
/* ============================================= */

.game-hud {

    position: fixed;

    left: 50%;

    bottom: 72px;

    transform:
        translateX(-50%)
        translateY(20px);

    z-index: 20;

    width: min(
        90%,
        500px
    );

    text-align: center;

    color: #d3a31a;

    font-size:
        clamp(
            .85rem,
            1.5vw,
            1rem
        );

    letter-spacing: 1px;

    padding:
        10px
        18px;

    opacity: 0;

    pointer-events: none;

    border-radius: 30px;

    background:
        rgba(
            10,
            8,
            0,
            .60
        );

    border:
        1px solid
        rgba(
            211,
            163,
            26,
            .18
        );

    backdrop-filter:
        blur(7px);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.game-hud.visible {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

.game-hud.completado {

    color: #e1bb43;

    animation:
        hudGanador
        1.4s
        ease-in-out
        infinite;
}

/* ============================================= */
/* DEDICATORIA */
/* ============================================= */

.dedicatoria {

    position: fixed;

    inset: 0;

    z-index: 40;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 22px;

    background:
        rgba(
            0,
            0,
            0,
            .82
        );

    backdrop-filter:
        blur(6px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s ease;
}

.dedicatoria.visible {

    opacity: 1;

    pointer-events: auto;
}

.tarjeta {

    width:
        min(
            92vw,
            650px
        );

    padding:
        38px
        30px;

    text-align: center;

    border-radius: 28px;

    border:
        1px solid
        rgba(
            198,
            150,
            14,
            .30
        );

    background:

        radial-gradient(
            circle at top,
            rgba(80, 55, 0, .35),
            rgba(12, 10, 4, .98) 55%
        );

    box-shadow:

        0 0 40px
        rgba(
            198,
            150,
            14,
            .10
        );

    transform:
        scale(.85)
        translateY(25px);

    transition:
        transform
        .7s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        );
}

.dedicatoria.visible
.tarjeta {

    transform:
        scale(1)
        translateY(0);
}

.icono-dedicatoria {

    font-size: 4rem;

    margin-bottom: 22px;

    animation:
        latidoSuave
        2.5s
        ease-in-out
        infinite;
}

.tarjeta p {

    color: #e4c770;

    font-size:
        clamp(
            1rem,
            2vw,
            1.35rem
        );

    line-height: 1.7;
}

.cerrar {

    margin-top: 28px;

    border: 0;

    border-radius: 25px;

    padding:
        10px
        22px;

    cursor: pointer;

    background:
        rgba(
            198,
            150,
            14,
            .14
        );

    color: #c99a14;

    font-weight: 600;

    font-size: .9rem;

    border:
        1px solid
        rgba(
            198,
            150,
            14,
            .24
        );
}

/* ============================================= */
/* VIÑETA */
/* ============================================= */

.vineta {

    position: fixed;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,
            transparent 53%,
            rgba(0,0,0,.12) 75%,
            rgba(0,0,0,.65) 100%
        );
}

/* ============================================= */
/* ANIMACIONES */
/* ============================================= */

@keyframes latidoPastel {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

@keyframes latidoSuave {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

@keyframes toqueAnimado {

    0%,
    100% {
        opacity: .4;
        transform:
            translateY(0);
    }

    50% {
        opacity: 1;
        transform:
            translateY(-4px);
    }
}

@keyframes hudGanador {

    0%,
    100% {
        transform:
            translateX(-50%)
            scale(1);
    }

    50% {
        transform:
            translateX(-50%)
            scale(1.04);
    }
}

</style>
</head>

<body>

<div id="universo"></div>

<div
    class="titulo"
    id="titulo"
>

    <h1>
        ¡Feliz cumpleaños, Jenny! 🎂
    </h1>

</div>

<div
    class="game-hud"
    id="gameHud"
>

    Atrape los pastelitos brillantes ✨

</div>

<div
    class="pie"
    id="pie"
>

    <p>
        HOY CELEBRAMOS SU VIDA ✨
    </p>

</div>

<!-- INTRO -->

<div
    class="inicio"
    id="inicio"
    role="button"
    tabindex="0"
    aria-label="Abrir sorpresa de cumpleaños para Jenny"
>

    <div class="inicio-contenido">

        <div class="pastel-inicial" aria-hidden="true">
            <div class="aro-carga"></div>
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bizcocho" x2="0" y2="1">
                  <stop stop-color="#ffe984"/><stop offset="1" stop-color="#bc780c"/>
                </linearGradient>
                <radialGradient id="fuego"><stop stop-color="#fffde0"/><stop offset=".5" stop-color="#ffe267"/><stop offset="1" stop-color="#ff9500"/></radialGradient>
              </defs>
              <ellipse cx="128" cy="220" rx="100" ry="14" fill="#c99400" opacity=".5"/>
              <rect x="38" y="132" width="180" height="82" rx="15" fill="url(#bizcocho)"/>
              <path d="M38 165H218V180H38Z" fill="#fff0b3"/>
              <ellipse cx="128" cy="133" rx="90" ry="23" fill="#fff2c5"/>
              <path d="M38 134 Q54 145 68 138 V155 Q76 170 84 155 V141 Q118 152 149 143 V161 Q158 177 167 160 V141 Q195 144 218 134" fill="#fff2c5"/>
              <g fill="#ffe984" stroke="#be830d" stroke-width="2">
                <rect x="82" y="78" width="12" height="53" rx="3"/>
                <rect x="122" y="67" width="12" height="64" rx="3"/>
                <rect x="162" y="78" width="12" height="53" rx="3"/>
              </g>
              <path d="M83 91L93 99M83 107L93 115M123 80L133 88M123 96L133 104M123 112L133 120M163 91L173 99M163 107L173 115" stroke="#fff9df" stroke-width="4"/>
              <g fill="url(#fuego)">
                <path class="llama" d="M88 77C69 70 85 49 88 43C94 56 105 71 88 77Z"/>
                <path class="llama llama-dos" d="M128 66C109 59 125 38 128 32C134 45 145 60 128 66Z"/>
                <path class="llama llama-tres" d="M168 77C149 70 165 49 168 43C174 56 185 71 168 77Z"/>
              </g>
              <g fill="#9f650b"><circle cx="68" cy="198" r="4"/><circle cx="98" cy="198" r="4"/><circle cx="128" cy="198" r="4"/><circle cx="158" cy="198" r="4"/><circle cx="188" cy="198" r="4"/></g>
            </svg>
        </div>

        <div class="toque">

            Toque el pastel 🎂

        </div>

    </div>

</div>

<!-- DEDICATORIA FINAL -->

<div
    class="dedicatoria"
    id="dedicatoria"
>

    <div class="tarjeta">

        <div
            class="icono-dedicatoria"
        >
            🎂
        </div>

        <p id="textoDedicatoria"></p>

        <button
            class="cerrar"
            id="cerrarDedicatoria"
        >

            Volver a los pastelitos 🎂 

        </button>

    </div>

</div>

<div class="vineta"></div>

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"

    }
}

</script>

<script type="module">

import * as THREE
from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ES_MOVIL =
    window.innerWidth < 700;

const CONFIG = {

    /* MUCHAS MÁS PASTELITOS */

    pastelitosGalaxia:
        ES_MOVIL
        ? 560
        : 1100,

    /* LLUVIA CONSTANTE */

    pastelitosLluvia:
        ES_MOVIL
        ? 50
        : 90,

    /* PETALOS DE LA PASTEL GIGANTE */

    petalosGigantes:
        14,

    /* DURACIÓN DE CONSTRUCCIÓN */

    duracionConstruccion:
        9500,

    /* PASTEL CENTRAL */

    escalaCentro:
        ES_MOVIL
        ? 9.5
        : 12,

    /* MINIJUEGO */

    objetivoJuego:
        8,

    pastelitosJuegoSimultaneas:
        ES_MOVIL
        ? 3
        : 4

};

/* =========================================================
   DEDICATORIA
========================================================= */

const TEXTO_DEDICATORIA = "Hola Jenny, espero que lo pase bonito en este día, solo pasaba por aqui para desearle un feliz cumpleaños. 🎂✨ Que este nuevo año de vida le traiga muchas alegrías, salud y momentos bonitos. ¡Que disfrute mucho su día y que se cumplan sus deseos! 🥳";

/* =========================================================
   DOM
========================================================= */

const contenedor =
    document.getElementById(
        "universo"
    );

const inicio =
    document.getElementById(
        "inicio"
    );

const titulo =
    document.getElementById(
        "titulo"
    );

const pie =
    document.getElementById(
        "pie"
    );

const gameHud =
    document.getElementById(
        "gameHud"
    );

const dedicatoria =
    document.getElementById(
        "dedicatoria"
    );

const textoDedicatoria =
    document.getElementById(
        "textoDedicatoria"
    );

const cerrarDedicatoria =
    document.getElementById(
        "cerrarDedicatoria"
    );

textoDedicatoria.textContent =
    TEXTO_DEDICATORIA;

/* =========================================================
   PASTEL HTML DEL INICIO
========================================================= */

/* =========================================================
   THREE.JS
========================================================= */

const escena =
    new THREE.Scene();

escena.fog =
    new THREE.FogExp2(

        0x000000,

        0.0028

    );

const camara =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );

const camaraInicio =
    new THREE.Vector3(

        0,
        7,
        22

    );

const camaraFinal =
    new THREE.Vector3(

        0,
        55,
        62

    );

camara.position.copy(
    camaraInicio
);

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: false

    });

renderer.setSize(

    window.innerWidth,

    window.innerHeight

);

renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        2

    )

);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.setClearColor(

    0x000000,

    1

);

contenedor.appendChild(

    renderer.domElement

);

/* =========================================================
   CONTROLES
========================================================= */

const controles =
    new OrbitControls(

        camara,

        renderer.domElement

    );

controles.enableDamping =
    true;

controles.dampingFactor =
    0.045;

controles.enablePan =
    false;

controles.enableZoom =
    true;

controles.minDistance =
    24;

controles.maxDistance =
    105;

controles.minPolarAngle =
    0.25;

controles.maxPolarAngle =
    1.35;

controles.autoRotate =
    false;

controles.enabled =
    false;

controles.target.set(

    0,
    0,
    0

);

/* =========================================================
   UTILIDADES
========================================================= */

function clamp(
    valor,
    min,
    max
) {

    return Math.min(

        Math.max(
            valor,
            min
        ),

        max

    );

}

function easeOutCubic(x) {

    return (
        1 -
        Math.pow(
            1 - x,
            3
        )
    );

}

function easeInOutCubic(x) {

    return (
        x < .5

        ?

        4 *
        x *
        x *
        x

        :

        1 -
        Math.pow(
            -2 * x + 2,
            3
        ) /
        2
    );

}

/* =========================================================
   CREAR TEXTURA DE PASTEL
========================================================= */

// Textura compartida: mismo lienzo y escalas que la animación original.
function crearCanvasPastel() {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext("2d");
    const ellipse = (x,y,rx,ry,color) => {
        ctx.fillStyle=color; ctx.beginPath();
        ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
    };
    const rect = (x,y,w,h,r,color) => {
        ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
    };
    ellipse(128,218,96,12,"#b98019");
    const cake = ctx.createLinearGradient(0,125,0,218);
    cake.addColorStop(0,"#ffe38a"); cake.addColorStop(1,"#be7a16");
    rect(38,128,180,86,14,cake);
    rect(38,168,180,13,0,"#fff0b8");
    ellipse(128,130,90,23,"#fff2c6");
    for (const [x,h] of [[55,20],[88,29],[128,18],[163,30],[197,21]])
        rect(x,132,13,h,7,"#fff2c6");
    for (const x of [67,98,128,158,189]) ellipse(x,198,4,4,"#9d600c");
    for (const [x,y] of [[88,78],[128,66],[168,78]]) {
        rect(x-6,y,12,130-y,3,"#ffe277");
        ctx.save(); ctx.beginPath(); ctx.rect(x-6,y,12,130-y); ctx.clip();
        ctx.strokeStyle="#fff9e1"; ctx.lineWidth=4;
        for(let k=y+8;k<134;k+=16) {
            ctx.beginPath(); ctx.moveTo(x-8,k);ctx.lineTo(x+8,k+10);ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle="#805221";ctx.fillRect(x-1,y-7,2,7);
        ctx.save();ctx.shadowColor="#ffb72a";ctx.shadowBlur=14;
        const fire=ctx.createLinearGradient(x,y-35,x,y);
        fire.addColorStop(0,"#ff990f");fire.addColorStop(.55,"#ffe577");fire.addColorStop(1,"#fff9da");
        ctx.fillStyle=fire;ctx.beginPath();ctx.moveTo(x,y-36);
        ctx.bezierCurveTo(x-5,y-23,x-18,y-9,x,y-3);
        ctx.bezierCurveTo(x+18,y-9,x+6,y-23,x,y-36);ctx.fill();ctx.restore();
    }
    return canvas;
}

/* =========================================================
   TEXTURA
========================================================= */

const canvasPastel =
    crearCanvasPastel();

const texturaPastel =
    new THREE.CanvasTexture(
        canvasPastel
    );

texturaPastel.colorSpace =
    THREE.SRGBColorSpace;

/* =========================================================
   GRUPOS
========================================================= */

const universo =
    new THREE.Group();

escena.add(
    universo
);

const grupoGalaxia =
    new THREE.Group();

universo.add(
    grupoGalaxia
);

const grupoLluvia =
    new THREE.Group();

escena.add(
    grupoLluvia
);

const grupoJuego =
    new THREE.Group();

escena.add(
    grupoJuego
);

const grupoExplosiones =
    new THREE.Group();

escena.add(
    grupoExplosiones
);

/* =========================================================
   MATERIAL COMPARTIDO
========================================================= */

const materialGalaxia =
    new THREE.SpriteMaterial({

        map:
            texturaPastel,

        transparent:
            true,

        opacity:
            .96,

        depthWrite:
            false

    });

const materialLluvia =
    new THREE.SpriteMaterial({

        map:
            texturaPastel,

        transparent:
            true,

        opacity:
            .55,

        depthWrite:
            false

    });

/* =========================================================
   MATERIAL DE LAS PASTELITOS DEL MINIJUEGO
   MÁS BRILLANTE
========================================================= */

const materialJuego =
    new THREE.SpriteMaterial({

        map:
            texturaPastel,

        transparent:
            true,

        opacity:
            1,

        color:
            0xfff0a0,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false,

        toneMapped:
            false

    });

/* =========================================================
   PASTEL CENTRAL
========================================================= */

const materialCentro =
    new THREE.SpriteMaterial({

        map:
            texturaPastel,

        transparent:
            true,

        opacity:
            1,

        depthWrite:
            false

    });

const pastelCentral =
    new THREE.Sprite(
        materialCentro
    );

pastelCentral.scale.set(

    2.5,
    2.5,
    2.5

);

pastelCentral.position.set(

    0,
    .8,
    0

);

pastelCentral.userData.central =
    true;

grupoGalaxia.add(
    pastelCentral
);

/* =========================================================
   POSICIÓN DE LA GRAN PASTEL / GALAXIA
========================================================= */

function posicionGranPastel(
    indice
) {

    const random =
        Math.random();

    /*
       PARTE 1:
       centro alrededor
       de la pastel principal
    */

    if (
        random <
        .18
    ) {

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const radio =
            6 +
            Math.sqrt(
                Math.random()
            ) *
            9;

        return {

            x:
                Math.cos(
                    angulo
                ) *
                radio,

            y:
                (
                    Math.random() -
                    .5
                ) *
                .8,

            z:
                Math.sin(
                    angulo
                ) *
                radio

        };

    }

    /*
       PARTE 2:
       pétalos gigantes
    */

    if (
        random <
        .88
    ) {

        const petalo =
            Math.floor(

                Math.random() *
                CONFIG.petalosGigantes

            );

        const angulo =

            (
                petalo /
                CONFIG.petalosGigantes
            ) *

            Math.PI *
            2;

        const t =
            Math.pow(

                Math.random(),

                .68

            );

        const largo =
            10 +
            t *
            28;

        const anchoMax =
            2 +
            Math.sin(
                Math.PI *
                t
            ) *
            7;

        const lateral =

            (
                Math.random() *
                2 -
                1
            ) *

            anchoMax;

        const x =

            Math.cos(
                angulo
            ) *
            largo

            +

            Math.cos(
                angulo +
                Math.PI /
                2
            ) *
            lateral;

        const z =

            Math.sin(
                angulo
            ) *
            largo

            +

            Math.sin(
                angulo +
                Math.PI /
                2
            ) *
            lateral;

        return {

            x:
                x,

            y:
                (
                    Math.random() -
                    .5
                ) *
                1.2,

            z:
                z

        };

    }

    /*
       PARTE 3:
       halo exterior
       tipo galaxia
    */

    const progresion =
        indice /
        CONFIG.pastelitosGalaxia;

    const angulo =
        progresion *
        Math.PI *
        10

        +

        Math.random() *
        .4;

    const radio =
        31 +
        Math.random() *
        12;

    return {

        x:
            Math.cos(
                angulo
            ) *
            radio,

        y:
            (
                Math.random() -
                .5
            ),

        z:
            Math.sin(
                angulo
            ) *
            radio

    };

}

/* =========================================================
   CREAR LAS PASTELITOS DE LA GALAXIA
========================================================= */

const pastelitosGalaxia =
    [];

for (
    let i = 0;
    i < CONFIG.pastelitosGalaxia;
    i++
) {

    const pastel =
        new THREE.Sprite(
            materialGalaxia
        );

    const destino =
        posicionGranPastel(
            i
        );

    /*
       TODAS EMPIEZAN
       ARRIBA
    */

    const inicioX =

        destino.x

        +

        (
            Math.random() -
            .5
        ) *
        20;

    const inicioY =
        42 +
        Math.random() *
        55;

    const inicioZ =

        destino.z

        +

        (
            Math.random() -
            .5
        ) *
        20;

    pastel.position.set(

        inicioX,
        inicioY,
        inicioZ

    );

    pastel.scale.set(

        .001,
        .001,
        .001

    );

    pastel.userData = {

        inicio:

            new THREE.Vector3(

                inicioX,
                inicioY,
                inicioZ

            ),

        destino:

            new THREE.Vector3(

                destino.x,
                destino.y,
                destino.z

            ),

        delay:

            Math.random() *
            CONFIG.duracionConstruccion *
            .76,

        duracion:

            1500 +
            Math.random() *
            1600,

        escala:

            .62 +
            Math.random() *
            1.15,

        colocado:
            false

    };

    grupoGalaxia.add(
        pastel
    );

    pastelitosGalaxia.push(
        pastel
    );

}

/* =========================================================
   LLUVIA PERMANENTE DE PASTELITOS
========================================================= */

const pastelitosLluvia =
    [];

function reiniciarLluvia(
    pastel,
    inicial = false
) {

    pastel.position.set(

        (
            Math.random() -
            .5
        ) *
        72,

        inicial

        ?

        15 +
        Math.random() *
        80

        :

        55 +
        Math.random() *
        35,

        (
            Math.random() -
            .5
        ) *
        58

    );

    const escala =
        .42 +
        Math.random() *
        .85;

    pastel.scale.set(

        escala,
        escala,
        escala

    );

    pastel.userData.velocidad =
        4 +
        Math.random() *
        5;

    pastel.userData.deriva =
        (
            Math.random() -
            .5
        ) *
        .8;

    pastel.userData.oscilacion =
        Math.random() *
        Math.PI *
        2;

}

for (
    let i = 0;
    i < CONFIG.pastelitosLluvia;
    i++
) {

    const pastel =
        new THREE.Sprite(
            materialLluvia
        );

    reiniciarLluvia(
        pastel,
        true
    );

    grupoLluvia.add(
        pastel
    );

    pastelitosLluvia.push(
        pastel
    );

}

/* =========================================================
   MINIJUEGO
========================================================= */

const pastelitosJuego =
    [];

let puntuacion =
    0;

let juegoActivo =
    false;

let juegoGanado =
    false;

/* Crear pastelitos especiales */

for (
    let i = 0;
    i <
    CONFIG.pastelitosJuegoSimultaneas;
    i++
) {

    const pastel =
        new THREE.Sprite(
            materialJuego
        );

    pastel.visible =
        false;

    pastel.userData.juego =
        true;

    grupoJuego.add(
        pastel
    );

    pastelitosJuego.push(
        pastel
    );

}

/* Reiniciar pastel del juego */

function lanzarPastelJuego(
    pastel
) {

    if (
        juegoGanado
    ) {

        pastel.visible =
            false;

        return;

    }

    pastel.visible =
        true;

    pastel.position.set(

        (
            Math.random() -
            .5
        ) *
        55,

        46 +
        Math.random() *
        25,

        (
            Math.random() -
            .5
        ) *
        35

    );

    pastel.userData.velocidad =
        5 +
        Math.random() *
        3;

    /*
       MÁS GRANDES QUE LAS PASTELITOS NORMALES
    */

    pastel.userData.baseScale =
        4.0 +
        Math.random() *
        1.4;

    pastel.userData.fase =
        Math.random() *
        Math.PI *
        2;

}

/* Iniciar juego */

function iniciarJuego() {

    if (
        juegoActivo ||
        juegoGanado
    ) {

        return;

    }

    juegoActivo =
        true;

    puntuacion =
        0;

    gameHud.textContent =

        "Atrape los pastelitos brillantes ✨ · 0 / "

        +

        CONFIG.objetivoJuego;

    gameHud.classList.add(
        "visible"
    );

    pastelitosJuego.forEach(

        (
            pastel,
            indice
        ) => {

            setTimeout(

                () => {

                    lanzarPastelJuego(
                        pastel
                    );

                },

                indice *
                450

            );

        }

    );

}

/* =========================================================
   EXPLOSIÓN DE PASTELITOS
========================================================= */

const explosiones =
    [];

function explosionDePastelitos(
    posicion
) {

    const cantidad =
        12;

    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const material =
            materialGalaxia.clone();

        material.opacity =
            .90;

        const pastel =
            new THREE.Sprite(
                material
            );

        pastel.position.copy(
            posicion
        );

        const escala =
            .28 +
            Math.random() *
            .45;

        pastel.scale.set(

            escala,
            escala,
            escala

        );

        pastel.userData.velocidad =
            new THREE.Vector3(

                (
                    Math.random() -
                    .5
                ) *
                9,

                (
                    Math.random() -
                    .1
                ) *
                7,

                (
                    Math.random() -
                    .5
                ) *
                9

            );

        pastel.userData.vida =
            1;

        grupoExplosiones.add(
            pastel
        );

        explosiones.push(
            pastel
        );

    }

}

/* =========================================================
   ATRAPAR PASTEL
========================================================= */

function atraparPastel(
    pastel
) {

    if (
        !juegoActivo ||
        !pastel.visible
    ) {

        return;

    }

    const posicion =
        pastel.position.clone();

    pastel.visible =
        false;

    explosionDePastelitos(
        posicion
    );

    puntuacion++;

    if (
        puntuacion >=
        CONFIG.objetivoJuego
    ) {

        juegoActivo =
            false;

        juegoGanado =
            true;

        pastelitosJuego.forEach(
            f =>
            f.visible = false
        );

        gameHud.textContent =
            "✨ ¡Lo logró! Toque el pastel grande del centro 🎂";

        gameHud.classList.add(
            "completado"
        );

        return;

    }

    gameHud.textContent =

        "Atrape los pastelitos brillantes ✨ · "

        +

        puntuacion

        +

        " / "

        +

        CONFIG.objetivoJuego;

    setTimeout(

        () => {

            if (
                !juegoGanado
            ) {

                lanzarPastelJuego(
                    pastel
                );

            }

        },

        350

        +

        Math.random() *
        450

    );

}

/* =========================================================
   RAYCAST PARA LOS TOQUES
========================================================= */

const raycaster =
    new THREE.Raycaster();

const puntero =
    new THREE.Vector2();

function actualizarPuntero(
    evento
) {

    const rect =
        renderer.domElement
        .getBoundingClientRect();

    puntero.x =

        (
            (
                evento.clientX -
                rect.left
            ) /
            rect.width
        ) *
        2 -
        1;

    puntero.y =

        -

        (
            (
                evento.clientY -
                rect.top
            ) /
            rect.height
        ) *
        2 +
        1;

}

/* =========================================================
   TOCAR ESCENA
========================================================= */

renderer.domElement.addEventListener(

    "pointerdown",

    evento => {

        actualizarPuntero(
            evento
        );

        raycaster.setFromCamera(

            puntero,

            camara

        );

        /*
           PRIMERO:
           MINIJUEGO
        */

        if (
            juegoActivo
        ) {

            const objetivos =

                pastelitosJuego.filter(

                    pastel =>
                    pastel.visible

                );

            const impactos =

                raycaster.intersectObjects(
                    objetivos,
                    false
                );

            if (
                impactos.length >
                0
            ) {

                atraparPastel(
                    impactos[0].object
                );

                return;

            }

        }

        /*
           SEGUNDO:
           SI GANÓ,
           TOCAR PASTEL CENTRAL
        */

        if (
            juegoGanado
        ) {

            const impactoCentro =

                raycaster.intersectObject(

                    pastelCentral,

                    false

                );

            if (
                impactoCentro.length >
                0
            ) {

                mostrarDedicatoria();

            }

        }

    }

);

/* =========================================================
   DEDICATORIA
========================================================= */

function mostrarDedicatoria() {

    dedicatoria.classList.add(
        "visible"
    );

    explosionDePastelitos(

        new THREE.Vector3(
            0,
            3,
            0
        )

    );

}

function ocultarDedicatoria() {

    dedicatoria.classList.remove(
        "visible"
    );

}

cerrarDedicatoria.addEventListener(

    "click",

    ocultarDedicatoria

);

dedicatoria.addEventListener(

    "click",

    evento => {

        if (
            evento.target ===
            dedicatoria
        ) {

            ocultarDedicatoria();

        }

    }

);

/* =========================================================
   ESTADO PRINCIPAL
========================================================= */

const estado = {

    iniciado:
        false,

    tiempoInicio:
        0,

    construccionTerminada:
        false

};

/* =========================================================
   EMPEZAR EXPERIENCIA
========================================================= */

function empezar() {

    if (
        estado.iniciado
    ) {

        return;

    }

    estado.iniciado =
        true;

    estado.tiempoInicio =
        performance.now();

    inicio.classList.add(
        "oculto"
    );

}

/* Pointerdown funciona
   tanto en móvil
   como PC */

inicio.addEventListener(

    "click",

    empezar

);

/* =========================================================
   RELOJ
========================================================= */

inicio.addEventListener("keydown", evento => {
    if (evento.key === "Enter" || evento.key === " ") { evento.preventDefault(); empezar(); }
});

const reloj =
    new THREE.Clock();

/* =========================================================
   ANIMAR LLUVIA
========================================================= */

function animarLluvia(
    delta,
    tiempo
) {

    if (
        !estado.iniciado
    ) {

        return;

    }

    pastelitosLluvia.forEach(
        pastel => {

            pastel.position.y -=

                pastel.userData.velocidad
                *
                delta;

            pastel.position.x +=

                Math.sin(

                    tiempo *

                    .7

                    +

                    pastel.userData.oscilacion

                )

                *

                pastel.userData.deriva

                *

                delta;

            if (
                pastel.position.y <
                -8
            ) {

                reiniciarLluvia(
                    pastel
                );

            }

        }
    );

}

/* =========================================================
   ANIMAR JUEGO
========================================================= */

function animarJuego(
    delta,
    tiempo
) {

    if (
        !juegoActivo
    ) {

        return;

    }

    pastelitosJuego.forEach(
        pastel => {

            if (
                !pastel.visible
            ) {

                return;

            }

            pastel.position.y -=

                pastel.userData.velocidad
                *
                delta;

            pastel.position.x +=

                Math.sin(

                    tiempo *
                    2

                    +

                    pastel.userData.fase

                )

                *
                .35
                *
                delta;

            /*
               PULSO MÁS FUERTE PARA
               DIFERENCIARLAS DEL RESTO
            */

            const pulso =

                pastel.userData.baseScale

                *

                (
                    1 +

                    Math.sin(

                        tiempo *
                        5

                        +

                        pastel.userData.fase

                    )

                    *
                    .18
                );

            pastel.scale.set(

                pulso,
                pulso,
                pulso

            );

            /*
               SI NO LA ATRAPA
               VUELVE ARRIBA
            */

            if (
                pastel.position.y <
                -6
            ) {

                lanzarPastelJuego(
                    pastel
                );

            }

        }
    );

}

/* =========================================================
   ANIMAR EXPLOSIONES
========================================================= */

function animarExplosiones(
    delta
) {

    for (
        let i =
            explosiones.length - 1;

        i >= 0;

        i--
    ) {

        const pastel =
            explosiones[i];

        pastel.position.addScaledVector(

            pastel.userData.velocidad,

            delta

        );

        pastel.userData.velocidad.y -=

            3 *
            delta;

        pastel.userData.vida -=

            delta *
            1.4;

        pastel.scale.multiplyScalar(

            .97

        );

        pastel.material.opacity =

            Math.max(

                0,

                pastel.userData.vida

            );

        if (
            pastel.userData.vida <=
            0
        ) {

            grupoExplosiones.remove(
                pastel
            );

            pastel.material.dispose();

            explosiones.splice(
                i,
                1
            );

        }

    }

}

/* =========================================================
   ANIMACIÓN PRINCIPAL
========================================================= */

function animar() {

    requestAnimationFrame(
        animar
    );

    const delta =
        Math.min(

            reloj.getDelta(),

            .04

        );

    const tiempo =
        reloj.elapsedTime;

    /*
       ANTES DE TOCAR
    */

    if (
        !estado.iniciado
    ) {

        camara.position.lerp(

            camaraInicio,

            .05

        );

        camara.lookAt(
            0,
            0,
            0
        );

        renderer.render(

            escena,

            camara

        );

        return;

    }

    /* ===========================================
       TIEMPO DESDE EL TOQUE
    =========================================== */

    const transcurrido =

        performance.now()

        -

        estado.tiempoInicio;

    const progresoGeneral =

        clamp(

            transcurrido /

            CONFIG.duracionConstruccion,

            0,

            1

        );

    const progresoCamara =

        easeInOutCubic(
            progresoGeneral
        );

    /* ===========================================
       CÁMARA CINEMATOGRÁFICA
    =========================================== */

    if (
        !estado.construccionTerminada
    ) {

        camara.position.lerpVectors(

            camaraInicio,

            camaraFinal,

            progresoCamara

        );

        camara.lookAt(

            0,
            0,
            0

        );

    }

    /* ===========================================
       PASTEL CENTRAL PASTELECE
    =========================================== */

    const aperturaCentro =

        easeOutCubic(

            clamp(

                transcurrido /
                2600,

                0,

                1

            )

        );

    const escalaCentro =

        2.5

        +

        (
            CONFIG.escalaCentro -
            2.5
        )

        *

        aperturaCentro;

    /*
       Si ganó,
       el pastel central
       palpita más
    */

    const intensidadLatido =

        juegoGanado
        ?
        .09
        :
        .025;

    const latido =

        1

        +

        Math.sin(

            tiempo *
            (
                juegoGanado
                ?
                4
                :
                2
            )

        )

        *
        intensidadLatido;

    pastelCentral.scale.set(

        escalaCentro *
        latido,

        escalaCentro *
        latido,

        escalaCentro *
        latido

    );

    /* ===========================================
       CONSTRUIR LA GRAN PASTEL
    =========================================== */

    if (
        !estado.construccionTerminada
    ) {

        pastelitosGalaxia.forEach(

            pastel => {

                const t =

                    clamp(

                        (
                            transcurrido

                            -

                            pastel.userData.delay
                        )

                        /

                        pastel.userData.duracion,

                        0,

                        1

                    );

                if (
                    t <=
                    0
                ) {

                    return;

                }

                const suave =

                    easeOutCubic(
                        t
                    );

                pastel.position.lerpVectors(

                    pastel.userData.inicio,

                    pastel.userData.destino,

                    suave

                );

                /*
                   pequeño arco
                   al caer
                */

                pastel.position.y +=

                    Math.sin(

                        Math.PI *
                        t

                    )

                    *
                    2;

                const escala =

                    pastel.userData.escala

                    *

                    suave;

                pastel.scale.set(

                    escala,
                    escala,
                    escala

                );

            }

        );

    }

    /* ===========================================
       MOVIMIENTO SUAVE GALAXIA
    =========================================== */

    grupoGalaxia.rotation.y +=

        .0007;

    /* ===========================================
       LLUVIA
    =========================================== */

    animarLluvia(
        delta,
        tiempo
    );

    /* ===========================================
       TEXTOS
    =========================================== */

    if (
        transcurrido >
        1300
    ) {

        titulo.classList.add(
            "visible"
        );

    }

    if (
        transcurrido >
        5200
    ) {

        pie.classList.add(
            "visible"
        );

    }

    /* ===========================================
       TERMINÓ CONSTRUCCIÓN
    =========================================== */

    if (

        transcurrido >

        CONFIG.duracionConstruccion

        +

        2200

        &&

        !estado.construccionTerminada

    ) {

        estado.construccionTerminada =
            true;

        controles.enabled =
            true;

        controles.autoRotate =
            true;

        controles.autoRotateSpeed =
            .20;

        iniciarJuego();

    }

    /* ===========================================
       MINIJUEGO
    =========================================== */

    animarJuego(

        delta,

        tiempo

    );

    /* ===========================================
       EXPLOSIONES
    =========================================== */

    animarExplosiones(
        delta
    );

    /* ===========================================
       CONTROLES
    =========================================== */

    controles.update();

    /* ===========================================
       RENDER
    =========================================== */

    renderer.render(

        escena,

        camara

    );

}

animar();

/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        camara.aspect =

            window.innerWidth /

            window.innerHeight;

        camara.updateProjectionMatrix();

        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>
